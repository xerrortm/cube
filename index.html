function secSpawn(){const a=qList(),lp=TV('Q','lp',0);return sec('Spawn trigger',`<div class=sum data-sum=Q>${sumHtml('Q')}</div>`
 +a.map((v,i)=>{const w=v<0;return`<div class=qr><span class=qi>${w?'Wait':'Call'}</span><div class=st><button class=sb2 data-a=step data-d=-1>&minus;</button><input class=nn type=number data-q=${i} data-w=${w?1:0} data-st=${w?.5:1} value="${w?-v:v}" step=${w?.05:1} min=${w?.05:1}><button class=sb2 data-a=step data-d=1>+</button></div><div class=qm><button data-a=qup data-i=${i} title="Move up">&uarr;</button><button data-a=qdn data-i=${i} title="Move down">&darr;</button><button data-a=qdel data-i=${i} title="Remove">&times;</button></div>${w?'':`<span class=qd>${qDesc(v)}</span>`}</div>`}).join('')

/* ---- object ID box ---- */
function secId(){let v,mixed=0,seen=0;
 eachSel((x,y,c,q)=>{const l=LY(E.rows,E.props,x,y),n=E.er|0,p=E.props[q]||{},ids=[];if((n==0||n==1)&&l.b)ids.push(p.n1|0);if((n==0||n==2)&&l.m)ids.push(p.n2|0);if((n==0||n==3)&&l.t)ids.push(p.n3|0);for(const i of ids){if(!seen){v=i;seen=1}else if(i!=v)mixed=1}});
 const u=usedIds(),all=new Map([...u.o,...u.t]),a=[...all.entries()].sort((p,q)=>p[0]-q[0]).slice(0,60);
 return sec('Object ID',`<div class=st><button class=sb2 data-a=step data-d=-1>&minus;</button><input id=idIn class=nn type=number min=0 max=9999 step=1 data-st=1 placeholder="${mixed?'mixed':'none'}" value="${mixed||!v?'':v}"><button class=sb2 data-a=step data-d=1>+</button></div>`

 +`<div class=hint>Objects with the same ID act as one group.</div>`)}
/* ---- position ---- */
function nudge(dx,dy){if(!E.sel)return;const s=E.nstep||2;snap();const r=selR(),L=grab(1),a=stampH(L,r.x0,r.y0,dx*s,dy*s)||stampH(L,r.x0,r.y0,0,0);if(a)E.sel={x0:a.x0,y0:a.y0,x1:a.x1,y1:a.y1};renderProps();autosave()}
function setRotAbs(a){snap();eachSel((x,y,c,k)=>{if(!ROTOK.includes(c))return;const q={...(E.props[k]||{})};if(a)q.a=a;else delete q.a;if(Object.keys(q).length)E.props[k]=q;else delete E.props[k]});renderProps();autosave()}
function secTransform(){let sol=0,bgc=0,any=0;eachSel((x,y,c)=>{any=1;if(BGM[c])sol++;else if(BGB[c])bgc++});if(!any)return'';let b='';
 if(sol||bgc)b+=`<div class=fg><div class=fl><span>Collision</span></div>${seg([[1,'Solid'],[0,'Background']],bgc==0&&sol>0?1:sol==0&&bgc>0?0:-1,'data-a=col')}</div>`;
 b+=`<div class=fg><div class=fl><span>Nudge</span></div><div class=tr><div class=pad><button data-a=nudge data-x=0 data-y=-1>&uarr;</button><button data-a=nudge data-x=-1 data-y=0>&larr;</button><button data-a=nudge data-x=1 data-y=0>&rarr;</button><button data-a=nudge data-x=0 data-y=1>&darr;</button></div><div>${seg([[1,'Half block'],[2,'1 block']],E.nstep||2,'data-a=nstep')}</div></div></div>`;
 return sec('Position',b)}
function panelHtml(){const r=selR(),cnt={};eachSel((x,y,c)=>{cnt[c]=(cnt[c]||0)+1});const kinds=Object.keys(cnt),tot=kinds.reduce((a,k)=>a+cnt[k],0),w=r.x1-r.x0+1,h=r.y1-r.y0+1;
 const title=!tot?'Empty area':kinds.length==1?(tot==1?nameOf(kinds[0]):tot+' x '+nameOf(kinds[0])):tot+' objects';
 let h2=`<div class=ph2><div class=tt><b>${title}</b><small>${w} x ${h} tiles</small></div><button class=ib2 data-a=min>${E.pmin?'Show':'Hide'}</button><button class=ib2 data-a=close>Close</button></div><div class=pbody>`;
 if(!tot)return h2+`<div class=hint>Nothing here.</div><div class=pa2><button class="b g" data-a=paste>Paste</button><button class="b g" data-a=close>Done</button></div></div>`;
 if(cnt.T)h2+=secMove();if(cnt.P)h2+=secFollow();if(cnt.Q)h2+=secSpawn();
 for(const k of['M','B','O','F'])if(cnt[k]){const S=SETS[k];h2+=sec(S.n,S.f.map(f=>fld(k,f[0],f[1],f[2],f[3],f[4],f[5],f[6])).join(''))}
 if(kinds.some(k=>POTC[k])){let on=0;eachSel((x,y,c,q)=>{if(POTC[c]&&E.props[q]?.bar)on=1});h2+=sec('Potion',sw('Barrier','Full-height line; crossing it applies the effect',on,'data-k=bar'))}
 h2+=secId()+secTransform();
 h2+=`<div class=pa2><button class="b g" data-a=dup>Duplicate</button><button class="b g" data-a=copy>Copy</button><button class="b g" data-a=paste>Paste</button><button class="b g danger" data-a=del>Delete</button></div></div>`;return h2}
function renderProps(){const P=$('#props');if(!E||!E.sel){P.classList.remove('on');return}
 const sc=P.querySelector('.pbody'),st=sc?sc.scrollTop:0;P.innerHTML=panelHtml();P.classList.toggle('min',!!E.pmin);const nb=P.querySelector('.pbody');if(nb)nb.scrollTop=st;P.classList.add('on')}/* ---- panel events ---- */
{const P=$('#props');let sn=0;
 P.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||!E||b.tagName=='INPUT')return;const a=b.dataset.a,d=b.dataset;
  switch(a){
   case'close':endSel();break;case'min':E.pmin=!E.pmin;renderProps();break;
   case'layer':setLayer(+d.v);break;case'rot':setRotAbs(+d.v);break;case'col':selCol(+d.v);break;
   case'nudge':nudge(+d.x,+d.y);break;case'nstep':E.nstep=+d.v;renderProps();break;
   case'dup':selDup();break;case'copy':selCopy();break;case'paste':selPaste();break;case'del':selDel();break;
   case'brush':{let c='';eachSel((x,y,ch)=>{if(!c)c=ch});if(c)pick(c);break}
   case'seg':case'fid':case'reset':snap();setProp(d.t,d.f,+(a=='reset'?d.d:d.v));renderProps();autosave();break;
   case'ftgt':snap();setProp('P','tg',+d.v?(TV('P','tg',0)||1):0);renderProps();autosave();break;
   case'step':{const i=b.parentElement.querySelector('.nn');if(!i)break;const s=+i.dataset.st||1;i.value=Math.round(((+i.value||0)+(+d.d)*s)*100)/100;i.dispatchEvent(new Event('change',{bubbles:true}));break}
   case'show':if(+d.v){E.hl=+d.v;E.hlu=now+2}break;
   case'idnew':setId(nextId());break;case'idclear':setId(0);break;case'idset':setId(+d.v);break;
   case'qadd':qAdd(+d.v);break;case'qup':qMv(+d.i,-1);break;case'qdn':qMv(+d.i,1);break;case'qdel':qDel(+d.i);break;
   case'qpick':{const a2=qList();if(a2.length<40){a2.push(+d.v);qSet(a2)}break}}});
 P.addEventListener('input',e=>{const t=e.target;if(t.type!='range'||!E)return;if(!sn){snap();sn=1}const v=+t.value,n=t.closest('.fd').querySelector('.nn');if(n)n.value=v;setProp(t.dataset.t,t.dataset.f,v);refreshSums()});
 P.addEventListener('change',e=>{const t=e.target,ds=t.dataset;if(!E)return;sn=0;
  if(t.id=='idIn'){setId(t.value);return}
  if(ds.idp!=null){if(t.value!=='')setId(t.value);else renderProps();return}
  if(ds.qp!=null){const v=+t.value;if(v){const a=qList();if(a.length<40){a.push(v);qSet(a)}}else renderProps();return}
  if(ds.q!=null){qEdit(+ds.q,t.value,+ds.w);return}

  if(ds.f&&ds.t){snap();setProp(ds.t,ds.f,clampV(t.value,+ds.mn,+ds.mx,ds.int=='1'));renderProps();autosave();return}
  if(ds.a=='tog'){if(ds.k=='bar')togBar();else if(ds.k=='tc')togTouch(ds.t);else if(ds.k=='lp')togLoop()}});
 P.addEventListener('mouseover',e=>{const c=e.target.closest('[data-hl]');if(c){E.hl=+c.dataset.hl;E.hlu=1e9}});

 for(const k in E.props){const q=E.props[k],ids=[...new Set([q.n3,q.n2,q.n1].filter(Boolean))];if(!ids.length)continue;const[x,y]=k.split(',').map(Number);if(!E.rows[y]||!E.rows[y][x]||E.rows[y][x]=='.')continue;const X=(x*T-E.cx)*z,Y=(y*T-E.cy)*z;if(X<-s||Y<-s||X>W||Y>H)continue;const t=ids.join('/'),w=g.measureText(t).width+6;g.fillStyle='#000b';g.fillRect(X+1,Y+1,w,15);g.fillStyle='#7fffd4';g.fillText(t,X+4,Y+2)}g.restore()}

 eachSel((x,y,c,k)=>{if(!'TPQ'.includes(c))return;const p=E.props[k]||{},a=P(x,y),col=TRC[c],line=(ids,cl)=>{g.strokeStyle=cl;for(const id of ids)for(const[cx,cy]of idCells(id)){const b=P(cx,cy);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke()}};
